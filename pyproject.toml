[project]
name = "story-to-drama-compiler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "asyncpg>=0.29,<1", "fastapi>=0.115,<1",
  "pydantic>=2.9,<3", "sqlalchemy[asyncio]>=2.0,<3", "temporalio>=1.7,<2",
  "httpx>=0.27,<1", "pypdf>=6.10,<7",
]
[dependency-groups]
dev = ["mypy>=1.11,<2", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sdc"]
[tool.hatch.build.targets.wheel.force-include]
"src/sdc/visual_prompt_profiles.json" = "sdc/visual_prompt_profiles.json"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sdc"]
