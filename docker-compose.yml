services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: sdc, POSTGRES_PASSWORD: sdc, POSTGRES_DB: sdc}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sdc"], interval: 5s, timeout: 3s, retries: 10}
  temporal:
    image: temporalio/auto-setup:1.27
    depends_on: [postgres]
    environment: {DB: postgresql, DB_PORT: 5432, POSTGRES_USER: sdc, POSTGRES_PWD: sdc, POSTGRES_SEEDS: postgres}
    ports: ["7233:7233"]
